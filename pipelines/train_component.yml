$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: churn_train
version: "1"
display_name: "Customer Churn – Train Ensemble + SMOTE"
description: >
  Trains an ensemble model (AdaBoost + Random Forest) with SMOTE
  class-imbalance handling and logs metrics to Azure ML via MLflow.
type: command

inputs:
  raw_data:
    type: uri_folder
  n_estimators:
    type: integer
    default: 100
  test_size:
    type: number
    default: 0.2
  random_state:
    type: integer
    default: 42
  model_name:
    type: string
    default: "customer-churn-ensemble"

outputs:
  model_output:
    type: uri_folder

code: ../src

environment:
  conda_file: ../environment.yml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04

command: >-
  python train.py
  --local
  --data-dir ${{inputs.raw_data}}
  --model-dir ${{outputs.model_output}}
  --n-estimators ${{inputs.n_estimators}}
  --test-size ${{inputs.test_size}}
  --random-state ${{inputs.random_state}}
  --model-name ${{inputs.model_name}}
